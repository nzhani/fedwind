# Checks every pull request must pass before merge (requirement NFR-12). Same steps as scripts/check.sh.
# Make them required in GitHub: Settings -> Branches -> branch protection for main -> require these
# checks and one approving review.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4 black==24.10.0
      - name: ruff
        run: >-
          ruff check federated-website/FastApi/app federated-website/FastApi/tests federated-website/FastApi/main.py
          site_agent inference Long-term_Forecasting/flower_app/my_flower_app Long-term_Forecasting/tests
          Long-term_Forecasting/scripts deploy/central/pki_init.py
      - name: black (files changed in this pull request)
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py' \
            | grep -vE '(^|/)(\.venv|node_modules|datasets)/|gateway-spike' > changed.txt || true
          if [ -s changed.txt ]; then xargs black --check < changed.txt; else echo "no changed Python files"; fi

  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fedwind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/fedwind_test
    defaults:
      run:
        working-directory: federated-website/FastApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - run: python -m pytest -q

  ml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r deploy/flower/requirements.lock.txt pytest==9.2.0 httpx==0.28.1
      - name: ML core
        run: python -m pytest -q Long-term_Forecasting/tests
      - name: inference
        run: python -m pytest -q inference/tests
      - name: site agent
        run: python -m pytest -q site_agent/tests

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: federated-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: federated-website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
