# Included by every proxied location (a location that sets its own proxy_set_header inherits none
# from the server block, so all of them live here). Headers a client might forge are blanked.
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $remote_addr;   # replaced, not appended: the API trusts the first entry
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header CF-Connecting-IP   "";
proxy_set_header X-Gateway-Secret   "";
proxy_set_header X-Site-Id          "";
proxy_set_header X-Client-Serial    "";
proxy_read_timeout                  300s;
